<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" fill="none">
  <defs>
    <linearGradient id="astBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051c24" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="emeraldGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="340" rx="16" fill="url(#astBg)" stroke="#164e63" stroke-width="1"/>

  <!-- Prompt Header Bubble -->
  <rect x="40" y="30" width="520" height="56" rx="28" fill="#0f172a" stroke="#0e7490" stroke-width="1.5"/>
  <circle cx="70" cy="58" r="16" fill="#0891b2" filter="url(#emeraldGlow)"/>
  <path d="M64 58 L76 58 M70 52 L70 64" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="100" y="62" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="500">
    "ทำรูปสินค้านี้เป็นโฆษณา Instagram แล้วทำวิดีโอ 5 วิ"
  </text>
  <rect x="480" y="44" width="65" height="28" rx="14" fill="#059669" filter="url(#emeraldGlow)"/>
  <text x="512" y="62" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">RESOLVED</text>

  <!-- Connecting Workflow Line -->
  <path d="M125 180 L475 180" stroke="url(#cyanLine)" stroke-width="3" stroke-dasharray="6 6" filter="url(#emeraldGlow)"/>

  <!-- Step 1 Card -->
  <g transform="translate(45, 120)">
    <rect width="145" height="150" rx="12" fill="#091e2b" stroke="#0891b2" stroke-width="1.5"/>
    <rect x="12" y="14" width="28" height="20" rx="10" fill="#0e7490"/>
    <text x="26" y="28" fill="#cffafe" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">01</text>
    <text x="12" y="58" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Background</text>
    <text x="12" y="74" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Remove</text>
    <rect x="12" y="90" width="120" height="20" rx="4" fill="#0f172a"/>
    <text x="72" y="104" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">BiRefNet Cutout</text>
    <text x="12" y="136" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="700">10 Credits</text>
  </g>

  <!-- Step 2 Card -->
  <g transform="translate(225, 120)">
    <rect width="145" height="150" rx="12" fill="#06222b" stroke="#059669" stroke-width="1.5"/>
    <rect x="12" y="14" width="28" height="20" rx="10" fill="#047857"/>
    <text x="26" y="28" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">02</text>
    <text x="12" y="58" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Product Studio</text>
    <text x="12" y="74" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Instagram 4:5</text>
    <rect x="12" y="90" width="120" height="20" rx="4" fill="#0f172a"/>
    <text x="72" y="104" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Luxury Template</text>
    <text x="12" y="136" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="700">50 Credits</text>
  </g>

  <!-- Step 3 Card -->
  <g transform="translate(405, 120)">
    <rect width="145" height="150" rx="12" fill="#0f172a" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="12" y="14" width="28" height="20" rx="10" fill="#1d4ed8"/>
    <text x="26" y="28" fill="#dbeafe" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">03</text>
    <text x="12" y="58" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Image to Video</text>
    <text x="12" y="74" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Duration 5 Sec</text>
    <rect x="12" y="90" width="120" height="20" rx="4" fill="#020617"/>
    <text x="72" y="104" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Wan 2.2 Motion</text>
    <text x="12" y="136" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="700">125 Credits</text>
  </g>

  <!-- Bottom Total Bar -->
  <rect x="150" y="295" width="300" height="30" rx="15" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="300" y="315" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">
    Total Quota: 185 Tora Credits • Safe Step-Billing
  </text>
</svg>
