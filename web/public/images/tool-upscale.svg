<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" fill="none">
  <defs>
    <linearGradient id="upBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180b2c" />
      <stop offset="100%" stop-color="#090514" />
    </linearGradient>
    <linearGradient id="splitLine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="1" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2" />
    </linearGradient>
    <filter id="purpleGlow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="340" rx="16" fill="url(#upBg)" stroke="#3b1d6e" stroke-width="1"/>
  
  <!-- Left Side: Low-res Pixelated Eye / Lens Art -->
  <g opacity="0.85">
    <!-- Pixel Blocks -->
    <rect x="50" y="80" width="40" height="40" fill="#4c1d95" stroke="#2e1065" stroke-width="2"/>
    <rect x="90" y="80" width="40" height="40" fill="#6d28d9" stroke="#2e1065" stroke-width="2"/>
    <rect x="130" y="80" width="40" height="40" fill="#7c3aed" stroke="#2e1065" stroke-width="2"/>
    <rect x="170" y="80" width="40" height="40" fill="#5b21b6" stroke="#2e1065" stroke-width="2"/>
    <rect x="210" y="80" width="40" height="40" fill="#4c1d95" stroke="#2e1065" stroke-width="2"/>
    <rect x="250" y="80" width="40" height="40" fill="#3b0764" stroke="#2e1065" stroke-width="2"/>

    <rect x="50" y="120" width="40" height="40" fill="#6d28d9" stroke="#2e1065" stroke-width="2"/>
    <rect x="90" y="120" width="40" height="40" fill="#a855f7" stroke="#2e1065" stroke-width="2"/>
    <rect x="130" y="120" width="40" height="40" fill="#c084fc" stroke="#2e1065" stroke-width="2"/>
    <rect x="170" y="120" width="40" height="40" fill="#9333ea" stroke="#2e1065" stroke-width="2"/>
    <rect x="210" y="120" width="40" height="40" fill="#6d28d9" stroke="#2e1065" stroke-width="2"/>
    <rect x="250" y="120" width="40" height="40" fill="#4c1d95" stroke="#2e1065" stroke-width="2"/>

    <rect x="50" y="160" width="40" height="40" fill="#7c3aed" stroke="#2e1065" stroke-width="2"/>
    <rect x="90" y="160" width="40" height="40" fill="#c084fc" stroke="#2e1065" stroke-width="2"/>
    <rect x="130" y="160" width="40" height="40" fill="#e9d5ff" stroke="#2e1065" stroke-width="2"/>
    <rect x="170" y="160" width="40" height="40" fill="#a855f7" stroke="#2e1065" stroke-width="2"/>
    <rect x="210" y="160" width="40" height="40" fill="#7c3aed" stroke="#2e1065" stroke-width="2"/>
    <rect x="250" y="160" width="40" height="40" fill="#5b21b6" stroke="#2e1065" stroke-width="2"/>

    <rect x="50" y="200" width="40" height="40" fill="#4c1d95" stroke="#2e1065" stroke-width="2"/>
    <rect x="90" y="200" width="40" height="40" fill="#6d28d9" stroke="#2e1065" stroke-width="2"/>
    <rect x="130" y="200" width="40" height="40" fill="#7c3aed" stroke="#2e1065" stroke-width="2"/>
    <rect x="170" y="200" width="40" height="40" fill="#6d28d9" stroke="#2e1065" stroke-width="2"/>
    <rect x="210" y="200" width="40" height="40" fill="#4c1d95" stroke="#2e1065" stroke-width="2"/>
    <rect x="250" y="200" width="40" height="40" fill="#3b0764" stroke="#2e1065" stroke-width="2"/>
  </g>

  <!-- Right Side: Razor Sharp 4K Ultra Curved Geometry with Micro-details -->
  <g filter="url(#purpleGlow)">
    <circle cx="380" cy="160" r="85" fill="none" stroke="#c084fc" stroke-width="2"/>
    <circle cx="380" cy="160" r="70" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="380" cy="160" r="55" fill="#4c1d95" fill-opacity="0.5" stroke="#e9d5ff" stroke-width="2"/>
    <circle cx="380" cy="160" r="30" fill="#e9d5ff" stroke="#ffffff" stroke-width="3"/>
    <circle cx="390" cy="150" r="8" fill="#ffffff"/>
    
    <!-- Fine detail rays -->
    <path d="M380 40 L380 75 M380 245 L380 280 M260 160 L295 160 M465 160 L500 160" stroke="#c084fc" stroke-width="1.5"/>
    <path d="M490 80 L470 100 M490 240 L470 220" stroke="#a855f7" stroke-width="1.5"/>
  </g>

  <!-- Split line -->
  <line x1="300" y1="20" x2="300" y2="320" stroke="url(#splitLine)" stroke-width="3" filter="url(#purpleGlow)"/>
  <circle cx="300" cy="170" r="16" fill="#7e22ce" stroke="#ffffff" stroke-width="2" filter="url(#purpleGlow)"/>
  <path d="M294 170 L298 166 M294 170 L298 174 M306 170 L302 166 M306 170 L302 174" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <!-- Badges -->
  <rect x="35" y="35" width="100" height="26" rx="13" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
  <text x="85" y="52" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">720p (Original)</text>

  <rect x="465" y="35" width="105" height="26" rx="13" fill="#6b21a8" fill-opacity="0.3" stroke="#c084fc" stroke-width="1"/>
  <text x="517" y="52" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">4K AI UPSCALE</text>
</svg>
