<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" fill="none">
  <defs>
    <linearGradient id="gemBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08182b" />
      <stop offset="100%" stop-color="#020814" />
    </linearGradient>
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a73e8" />
      <stop offset="50%" stop-color="#8ab4f8" />
      <stop offset="100%" stop-color="#ea4335" />
    </linearGradient>
    <filter id="blueGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="340" rx="16" fill="url(#gemBg)" stroke="#1e3a8a" stroke-width="1"/>

  <!-- Multimodal Data Streams (Video, Audio, Docs, Code) -->
  <path d="M60 80 C180 180 420 60 540 160" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5 5" opacity="0.6"/>
  <path d="M60 220 C180 120 420 240 540 140" stroke="#818cf8" stroke-width="2" stroke-dasharray="5 5" opacity="0.6"/>

  <!-- Central Gemini Star Core -->
  <g filter="url(#blueGlow)">
    <path d="M300 70 Q300 150 220 150 Q300 150 300 230 Q300 150 380 150 Q300 150 300 70 Z" fill="url(#gemGrad)"/>
    <circle cx="300" cy="150" r="16" fill="#ffffff" filter="url(#blueGlow)"/>
  </g>

  <!-- Multimodal Feature Tags -->
  <rect x="50" y="55" width="120" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="110" y="73" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">2,000,000 Tokens</text>

  <rect x="430" y="55" width="120" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="490" y="73" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Video &amp; Audio Input</text>

  <rect x="50" y="245" width="120" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="110" y="263" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Ultra Fast Flash</text>

  <rect x="430" y="245" width="120" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="490" y="263" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Code &amp; Function Call</text>

  <text x="300" y="265" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    GEMINI 2.5 PRO &amp; FLASH
  </text>
  <text x="300" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">
    Native Multimodality • 1-Hour Video Context • Ultra-Low Latency
  </text>
</svg>
